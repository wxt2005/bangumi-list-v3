name: Docker Image CI

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 145449811652.dkr.ecr.ap-northeast-1.amazonaws.com
  IMAGE_NAME: wxt2005/image-capture-bot-go

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        role-to-assume: arn:aws:iam::145449811652:role/bangumi-list-v3-github-actions-ecr-push
        aws-region: ap-northeast-1
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        push: true
        tags: 145449811652.dkr.ecr.ap-northeast-1.amazonaws.com/wxt2005/bangumi-list-v3:latest
        build-args: |
          GA_ID=${{ secrets.GA_ID }}
